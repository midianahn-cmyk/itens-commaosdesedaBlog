<style>
#cmsl_carrossel_logos {
  width: 100%;
  max-width: 1000px;
  margin: 20px auto;
  display: flex;
  align-items: center;
  gap: 8px;
  box-sizing: border-box;
}

#cmsl_carrossel_logos *,
#cmsl_carrossel_logos *::before,
#cmsl_carrossel_logos *::after {
  box-sizing: border-box;
}

#cmsl_janela_logos {
  width: 100%;
  overflow: hidden;
}

#cmsl_lista_logos {
  display: flex;
  width: 100%;
  transition: transform 0.4s ease;
  will-change: transform;
}

#cmsl_lista_logos > a {
  flex: 0 0 25%;
  width: 25%;
  padding: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-decoration: none;
}

#cmsl_lista_logos > a > img {
  display: block;
  width: 100%;
  max-width: 180px;
  height: 100px;
  object-fit: contain;
  border: 0;
  margin: 0;
  padding: 0;
}

#cmsl_botao_anterior,
#cmsl_botao_proximo {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  padding: 0;
  margin: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font-size: 28px;
  line-height: 40px;
  text-align: center;
  cursor: pointer;
  box-shadow: none;
  outline: none;
}

#cmsl_botao_anterior:hover,
#cmsl_botao_proximo:hover {
  transform: scale(1.15);
}

@media screen and (max-width: 600px) {

  #cmsl_carrossel_logos {
    gap: 4px;
  }

  #cmsl_lista_logos > a {
    flex: 0 0 50%;
    width: 50%;
    padding: 8px;
  }

  #cmsl_lista_logos > a > img {
    height: 80px;
  }

  #cmsl_botao_anterior,
  #cmsl_botao_proximo {
    width: 32px;
    height: 36px;
    font-size: 22px;
    line-height: 36px;
  }
}
</style>

<script type="text/javascript">
//<![CDATA[
(function () {

  var cmsl_lista = document.getElementById("cmsl_lista_logos");
  var cmsl_anterior = document.getElementById("cmsl_botao_anterior");
  var cmsl_proximo = document.getElementById("cmsl_botao_proximo");

  if (!cmsl_lista || !cmsl_anterior || !cmsl_proximo) {
    return;
  }

  var cmsl_posicao = 0;
  var cmsl_timer = null;

  function cmsl_logosVisiveis() {
    return window.innerWidth <= 600 ? 2 : 4;
  }

  function cmsl_atualizar() {

    var cmsl_visiveis = cmsl_logosVisiveis();
    var cmsl_total = cmsl_lista.children.length;
    var cmsl_maximo = Math.max(0, cmsl_total - cmsl_visiveis);

    if (cmsl_posicao > cmsl_maximo) {
      cmsl_posicao = 0;
    }

    if (cmsl_posicao < 0) {
      cmsl_posicao = cmsl_maximo;
    }

    var cmsl_deslocamento =
      (cmsl_posicao * 100) / cmsl_visiveis;

    cmsl_lista.style.transform =
      "translate3d(-" + cmsl_deslocamento + "%, 0, 0)";
  }

  function cmsl_avancar() {

    var cmsl_visiveis = cmsl_logosVisiveis();
    var cmsl_total = cmsl_lista.children.length;
    var cmsl_maximo = Math.max(0, cmsl_total - cmsl_visiveis);

    cmsl_posicao++;

    if (cmsl_posicao > cmsl_maximo) {
      cmsl_posicao = 0;
    }

    cmsl_atualizar();
  }

  function cmsl_voltar() {

    var cmsl_visiveis = cmsl_logosVisiveis();
    var cmsl_total = cmsl_lista.children.length;
    var cmsl_maximo = Math.max(0, cmsl_total - cmsl_visiveis);

    cmsl_posicao--;

    if (cmsl_posicao < 0) {
      cmsl_posicao = cmsl_maximo;
    }

    cmsl_atualizar();
  }

  function cmsl_iniciar() {

    clearInterval(cmsl_timer);

    cmsl_timer = setInterval(function () {
      cmsl_avancar();
    }, 3000);
  }

  cmsl_proximo.addEventListener("click", function () {
    cmsl_avancar();
    cmsl_iniciar();
  });

  cmsl_anterior.addEventListener("click", function () {
    cmsl_voltar();
    cmsl_iniciar();
  });

  window.addEventListener("resize", function () {
    cmsl_atualizar();
  });

  cmsl_atualizar();
  cmsl_iniciar();

})();
//]]>
</script>
