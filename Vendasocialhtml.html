<div>            
  <style>
/* Estilo da notificação custom 2 */
.notificacao-custom2 {
    position: fixed;
    top: 215px; /* distância da primeira notificação */
    right: 20px;
    width: auto;
   padding: 10px 15px 15px 10px;
    padding-bottom: 0px; /* Ajuste o valor conforme necessário */
    background-color: #bcf5ff; /* cor de fundo diferente, se quiser */
    color: #000;
    border-radius: 8px;
  border: 2px dotted #008080; /* 👈 borda pontilhada */
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    z-index: 9999;
    font-family: Arial, sans-serif;
    animation: slideIn 0.5s ease-out;
   
}

.notificacao-custom2 img {
    width: 40px;
    height: 40px;
    margin: 0px 10px 10px 10px;
}

.notificacao-custom2 .mensagem2 {
    flex: 1;
}

.notificacao-custom2 .fechar2 {
    cursor: pointer;
    font-weight: bold;
    margin-left: 10px;
}

/* animação */
@keyframes slideIn {
    from { opacity: 0; transform: translateX(100%); }
    to { opacity: 1; transform: translateX(0); }
}
   
   /* RESPONSIVIDADE 👇 */
@media (max-width: 768px) { /* tablets e celulares */
    .notificacao-custom2 {
        width: 80%;   /* ocupa mais largura */
        right: 10px;  /* encosta menos na borda */
        left: 10px;   /* centraliza melhor */
        font-size: 14px; /* texto menor */
    }

    .notificacao-custom2 img {
        width: 30px;  /* imagem menor */
        height: 30px;
    }
}

@media (max-width: 480px) { /* celulares menores */
    .notificacao-custom2 {
        width: 90%;
        top: 220px; /* desce um pouco para não cobrir topo */
        padding: 8px 10px;
        font-size: 13px;
    }

    .notificacao-custom2 img {
        width: 25px;
        height: 25px;
    }
}
   
</style>

<script>
var notificacoesGIF2 = [
    &#39;<b>+6 </b>Pessoas estão aqui como você! &#39;,
    &#39;<b>+2 </b>Pessoas estão aqui como você!&#39;,
        &#39;<b>+1 pessoa </b>se inscreveu aqui:  &#39;,
      &#39;<b>+3 </b>Pessoas estão aqui como você agora! &#39;,
    &#39;<b>+4 </b>Pessoas estão aqui como você agora! &#39;,
    &#39;<b>+2 </b>Pessoas estão aqui como você agora!&#39;,
      &#39;<b>+9 </b>Pessoas estão aqui como você agora!&#39;,
    &#39;<b>+7 </b>Pessoas estão aqui como você agora!&#39;,
      &#39;<b>+1 pessoa </b>se inscreveu aqui:  &#39;
 
];

function exibirNotificacaoGIF2() {
    var ultimaFechadaGIF2 = localStorage.getItem(&#39;notificacaoFechadaGIF2&#39;);
    var bloqueioGIF2 = 5 * 60 * 1000; // bloqueio 5min ao fechar manual
    var agoraGIF2 = new Date().getTime();

    if (!ultimaFechadaGIF2 || (agoraGIF2 - ultimaFechadaGIF2 &gt; bloqueioGIF2)) {
        var notif2 = document.createElement(&#39;div&#39;);
        notif2.className = &#39;notificacao-custom2&#39;;

        var img2 = document.createElement(&#39;img&#39;);
        img2.src = &#39;https://i.giphy.com/z9WAlV4MUvpU4.webp&#39;;
        notif2.appendChild(img2);

        var msg2 = document.createElement(&#39;div&#39;);
        msg2.className = &#39;mensagem2&#39;;
        msg2.innerHTML = notificacoesGIF2[Math.floor(Math.random() * notificacoesGIF2.length)];
        notif2.appendChild(msg2);

        var fechar2 = document.createElement(&#39;div&#39;);
        fechar2.className = &#39;fechar2&#39;;
        fechar2.innerHTML = &#39;&#10006;&#39;;
        fechar2.onclick = function() {
            notif2.remove();
            localStorage.setItem(&#39;notificacaoFechadaGIF2&#39;, new Date().getTime());
        };
        notif2.appendChild(fechar2);

        document.body.appendChild(notif2);

        var tempoExibicao = 20000; // 20s visível
        var pausa = 3000;           // 3s pausa entre notificações

        // primeiro remove a notificação após tempoExibicao
        setTimeout(function() {
            if (notif2.parentNode) notif2.remove();

            // depois da pausa, chama a próxima notificação
            setTimeout(exibirNotificacaoGIF2, pausa);
        }, tempoExibicao);

    } else {
        // se estiver bloqueada, verifica novamente após 5 segundos
        setTimeout(exibirNotificacaoGIF2, 5000);
    }
}

// primeira notificação aparece imediatamente
exibirNotificacaoGIF2();
</script>      </div>
